<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger Monitor</title>
<meta name="description" content="Paper record of your share in the pooled account.">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f4f6fa; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
  --accent: #0f766e; --accent-ink: #ffffff; --up: #15803d; --down: #b91c1c; --warn: #b45309; --soft: #eef2f7;
  --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220; --card: #131c2e; --ink: #e8eef8; --muted: #8fa0b8; --line: #243049;
    --accent: #2dd4bf; --accent-ink: #04201c; --up: #4ade80; --down: #f87171; --warn: #fbbf24; --soft: #1a2640;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220; --card: #131c2e; --ink: #e8eef8; --muted: #8fa0b8; --line: #243049;
  --accent: #2dd4bf; --accent-ink: #04201c; --up: #4ade80; --down: #f87171; --warn: #fbbf24; --soft: #1a2640; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding: 0 16px calc(84px + env(safe-area-inset-bottom)); }
.wrap { max-width: 560px; margin: 0 auto; }
header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 8px; }
header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
header .who { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.hero .big { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
.hero .sub { color: var(--muted); font-size: 14px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.stat .k { color: var(--muted); font-size: 12px; }
.stat .v { font-weight: 650; font-size: 16px; }
.up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); } .muted { color: var(--muted); }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .l { color: var(--muted); } .row .r { text-align: right; font-variant-numeric: tabular-nums; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; background: var(--soft); color: var(--muted); }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-height: 44px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font: inherit; border: 0; border-radius: 10px; min-height: 44px; padding: 0 16px; background: var(--accent); color: var(--accent-ink); font-weight: 650; cursor: pointer; }
button.ghost { background: var(--soft); color: var(--ink); }
button.danger { background: var(--down); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
button.full { width: 100%; margin-top: 12px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.preview { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 14px; min-height: 20px; }
.note { font-size: 12.5px; color: var(--muted); }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; padding: 12px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); z-index: 20; }
.toast.err { background: var(--down); color: #fff; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
nav.tabs button { flex: 1; max-width: 140px; background: transparent; color: var(--muted); border-radius: 0; min-height: 56px; font-size: 13px; }
nav.tabs button.on { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
.bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--soft); margin: 6px 0 10px; }
.bar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
svg.chart { width: 100%; height: 120px; display: block; }
.person { border-top: 1px solid var(--line); padding: 12px 0; }
.person:first-of-type { border-top: 0; }
.person .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.person .nm { font-weight: 650; }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; margin-top: 8px; font-size: 13px; }
.mini span { display: block; color: var(--muted); font-size: 11.5px; }
.disc { font-size: 12px; color: var(--muted); margin: 18px 2px; }
.center { text-align: center; padding-top: 14vh; }
.tabsw { display: flex; gap: 8px; margin-bottom: 4px; }
.tabsw button { flex: 1; }
@media (min-width: 600px) { body { padding-top: 12px; } }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted center">Loading…</p></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
