<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger Monitor</title>
<meta name="description" content="Paper record of your share in the pooled account.">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Apply the saved theme before first paint (system | light | dark), so there is no flash.
  try { var t = localStorage.getItem('ledger.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
/* Tokens follow the Tolits design system (src/theme): Manrope, lime accent, near-black ink / warm paper surfaces. */
:root {
  --accent: #C8FF3D; --accent-pressed: #B4EA2C; --accent-ink: #0D0D0D; --accent-ink-soft: #233007;
  --accent-text: #4F7A00; --accent-soft: rgba(200,255,61,0.32);
  --page: #F4F4F0; --surface: #FAFAF7; --card: #FFFFFF; --raised: #FFFFFF; --variant: #ECECE7; --line: #E1E1DB;
  --nav: rgba(255,255,255,0.92); --glass-border: rgba(13,13,13,0.08);
  --ink: #0D0D0D; --ink-2: #46464A; --muted: #7A7A7E; --placeholder: #9A9A9E; --divider: rgba(13,13,13,0.08);
  --up: #4F7A00; --down: #C93131; --warn: #A86A00; --info: #1D63C6;
  --up-bg: rgba(30,142,62,0.12); --down-bg: rgba(201,49,49,0.12); --warn-bg: rgba(168,106,0,0.14);
  --card-shadow: 0 4px 12px rgba(13,13,13,0.06); --sheet-shadow: 0 10px 24px rgba(13,13,13,0.14);
  --seg1: #4F7A00; --seg2: #1D63C6; --seg3: #D98F00;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent-text: #C8FF3D; --accent-soft: rgba(200,255,61,0.14);
    --page: #0A0A0A; --surface: #111113; --card: #17171A; --raised: #1C1C1E; --variant: #242426; --line: #2C2C2E;
    --nav: rgba(40,40,44,0.97); --glass-border: rgba(255,255,255,0.14);
    --ink: #F5F5F0; --ink-2: #D8D8D4; --muted: #8A8A8E; --placeholder: #6C6C70; --divider: rgba(255,255,255,0.07);
    --up: #C8FF3D; --down: #FF5C5C; --warn: #FFB020; --info: #6FB7FF;
    --up-bg: rgba(95,211,107,0.16); --down-bg: rgba(255,92,92,0.16); --warn-bg: rgba(255,176,32,0.16);
    --card-shadow: none; --sheet-shadow: 0 12px 24px rgba(0,0,0,0.45);
    --seg1: #C8FF3D; --seg2: #6FB7FF; --seg3: #FFB020;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent-text: #C8FF3D; --accent-soft: rgba(200,255,61,0.14);
  --page: #0A0A0A; --surface: #111113; --card: #17171A; --raised: #1C1C1E; --variant: #242426; --line: #2C2C2E;
  --nav: rgba(40,40,44,0.97); --glass-border: rgba(255,255,255,0.14);
  --ink: #F5F5F0; --ink-2: #D8D8D4; --muted: #8A8A8E; --placeholder: #6C6C70; --divider: rgba(255,255,255,0.07);
  --up: #C8FF3D; --down: #FF5C5C; --warn: #FFB020; --info: #6FB7FF;
  --up-bg: rgba(95,211,107,0.16); --down-bg: rgba(255,92,92,0.16); --warn-bg: rgba(255,176,32,0.16);
  --card-shadow: none; --sheet-shadow: 0 12px 24px rgba(0,0,0,0.45);
  --seg1: #C8FF3D; --seg2: #6FB7FF; --seg3: #FFB020;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body {
  font: 500 15px/1.4 Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  font-variant-numeric: tabular-nums; overscroll-behavior-y: none;
}
.wrap { max-width: 560px; margin: 0 auto; }

/* header */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 6px; }
header .hello { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
header h1 { font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -0.3px; margin: 0; }
.iconbtn { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 999px; background: var(--variant); color: var(--ink-2);
  display: inline-flex; align-items: center; justify-content: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.hdr-actions { display: flex; gap: 8px; }

/* cards & type */
.card { background: var(--card); border-radius: 20px; padding: 20px; margin: 12px 0; box-shadow: var(--card-shadow); }
.card h2 { font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.hero { padding-bottom: 14px; }
.hero .big { font-size: 40px; line-height: 46px; font-weight: 800; letter-spacing: -1px; word-break: break-word; }
.hero .sub { color: var(--muted); font-size: 13px; font-weight: 600; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border-radius: 16px; padding: 12px 14px; }
:root[data-theme="dark"] .stat { background: var(--raised); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat { background: var(--raised); } }
.stat .k { color: var(--muted); font-size: 12px; font-weight: 600; }
.stat .v { font-weight: 800; font-size: 17px; letter-spacing: -0.2px; margin-top: 2px; }
.up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); } .muted { color: var(--muted); }
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--divider); }
.row:last-child { border-bottom: 0; }
.row .l { color: var(--muted); font-size: 14px; min-width: 0; }
.row .r { text-align: right; font-weight: 700; font-size: 14px; flex: none; max-width: 60%; }
.chip { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .3px; background: var(--accent-soft); color: var(--accent-text); vertical-align: 2px; }
.chip.down { background: var(--down-bg); color: var(--down); }
.note { font-size: 13px; color: var(--muted); line-height: 1.45; }

/* forms */
label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 14px 0 6px; }
input, select, textarea {
  width: 100%; font: 600 16px/1.2 Manrope, system-ui, sans-serif; /* 16px stops iOS zooming into fields */
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; min-height: 50px;
  appearance: none; -webkit-appearance: none;
}
:root[data-theme="dark"] :is(input, select, textarea) { background: var(--raised); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) :is(input, select, textarea) { background: var(--raised); } }
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
input::placeholder { color: var(--placeholder); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; padding: 0; border-radius: 6px; accent-color: var(--accent); appearance: auto; -webkit-appearance: checkbox; }
button { font: 700 15px/1 Manrope, system-ui, sans-serif; border: 0; border-radius: 16px; min-height: 50px; padding: 0 18px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); transition: transform .14s ease, background .14s ease; touch-action: manipulation; }
button:active { transform: scale(0.97); background: var(--accent-pressed); }
button.ghost { background: var(--variant); color: var(--ink); }
button.ghost:active { background: var(--line); }
button.danger { background: var(--down-bg); color: var(--down); }
button.sm { min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; }
button:disabled { opacity: .45; cursor: default; transform: none; }
button.full { width: 100%; margin-top: 16px; min-height: 54px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btns > button { flex: 1 1 auto; }
.preview { background: var(--accent-soft); color: var(--ink); border-radius: 14px; padding: 12px 14px; margin-top: 14px; font-size: 14px; font-weight: 600; }
.preview .row { padding: 8px 0; }
details > summary { list-style: none; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--accent-text); padding: 10px 0 2px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: ' ›'; }
details[open] > summary::after { content: ' ˅'; }

/* password eye + login alert */
.pw { position: relative; }
.pw input { padding-right: 54px; }
.pw .eye { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 12px;
  background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.pw .eye:active { transform: translateY(-50%) scale(0.92); background: var(--variant); }
.pw .eye svg { width: 20px; height: 20px; }
input[aria-invalid="true"] { border-color: var(--down) !important; box-shadow: 0 0 0 3px var(--down-bg) !important; }
.alert { display: flex; gap: 10px; align-items: flex-start; background: var(--down-bg); color: var(--down); border-radius: 14px; padding: 12px 14px; margin-top: 14px; font-size: 14px; line-height: 1.4; }
.alert[hidden] { display: none; }
.alert svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.alert span { color: var(--ink-2); font-weight: 600; font-size: 13px; }
.shake { animation: shake .36s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* toast */
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; padding: 14px 16px;
  border-radius: 16px; background: var(--ink); color: var(--page); font-weight: 700; font-size: 14px; z-index: 30; box-shadow: var(--sheet-shadow); }
.toast.err { background: var(--down); color: #fff; }

/* floating pill tab bar (Tolits TabBar) */
nav.tabs { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 20; display: flex; justify-content: center; pointer-events: none; }
nav.tabs .bar { pointer-events: auto; display: flex; width: 100%; max-width: 460px; height: 64px; padding: 6px; border-radius: 999px;
  background: var(--nav); border: 1px solid var(--glass-border); box-shadow: var(--sheet-shadow); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
nav.tabs button { flex: 1; min-width: 0; min-height: 0; height: 100%; padding: 0 2px; border-radius: 999px; background: transparent; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 700; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button.on { background: var(--accent); color: var(--accent-ink); }
nav.tabs button:active { transform: scale(0.94); background: var(--variant); }
nav.tabs button.on:active { background: var(--accent-pressed); }

/* charts */
.bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--variant); margin: 8px 0 12px; }
.card .bar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
svg.chart { width: 100%; height: 120px; display: block; }
svg.growth { width: 100%; height: 180px; display: block; margin: 14px 0 4px; touch-action: pan-y; cursor: crosshair; overflow: visible; }
.ranges { display: flex; gap: 4px; padding: 4px; margin-top: 8px; background: var(--surface); border-radius: 999px; }
:root[data-theme="dark"] .ranges { background: var(--raised); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ranges { background: var(--raised); } }
.ranges button { flex: 1; min-height: 34px; padding: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 13px; }
.ranges button.on { background: var(--card); color: var(--ink); box-shadow: var(--card-shadow); }
:root[data-theme="dark"] .ranges button.on { background: var(--variant); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ranges button.on { background: var(--variant); } }
.delta { display: inline-block; margin-top: 8px; padding: 5px 10px; border-radius: 999px; font-weight: 800; font-size: 13px; }
.delta.up { background: var(--up-bg); } .delta.down { background: var(--down-bg); } .delta.muted { background: var(--variant); }

/* people (manager) */
.person { border-top: 1px solid var(--divider); padding: 14px 0; }
.person:first-of-type { border-top: 0; padding-top: 2px; }
.person .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.person .nm { font-weight: 800; font-size: 16px; }
.mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; font-size: 14px; font-weight: 700; }
.mini span { display: block; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; }

/* activity rows */
.tx { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--divider); }
.tx:last-child { border-bottom: 0; }
.tx .ic { width: 40px; height: 40px; border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--variant); color: var(--ink-2); }
.tx .ic svg { width: 18px; height: 18px; }
.tx .ic.in { background: var(--accent-soft); color: var(--accent-text); }
.tx .ic.out { background: var(--down-bg); color: var(--down); }
.tx .mid { flex: 1; min-width: 0; }
.tx .t1 { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .t2 { color: var(--muted); font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .amt { text-align: right; font-weight: 800; font-size: 15px; flex: none; }
.tx .amt small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }

.disc { font-size: 12px; color: var(--muted); margin: 18px 4px; line-height: 1.5; }
.center { text-align: center; padding-top: 14vh; }
.login-brand { text-align: center; padding: 10vh 0 8px; }
.login-brand .logo { width: 64px; height: 64px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; }
.login-brand h1 { font-size: 30px; line-height: 35px; font-weight: 800; letter-spacing: -0.6px; margin: 14px 0 4px; }
.viewas { position: sticky; top: 0; z-index: 15; margin: 0 -16px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--warn); color: #1f1300;
  display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 13.5px; font-weight: 700; }
.viewas button { min-height: 36px; border-radius: 999px; background: #1f1300; color: #fff; font-size: 13px; flex: none; }

/* small phones */
@media (max-width: 380px) {
  .hero .big { font-size: 34px; line-height: 40px; }
  .card { padding: 16px; border-radius: 18px; }
  .grid { gap: 8px; }
  .stat .v { font-size: 15px; }
  .mini { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form2 { grid-template-columns: 1fr !important; }
  nav.tabs button { font-size: 9.5px; }
  nav.tabs button svg { width: 20px; height: 20px; }
}
@media (min-width: 700px) { body { padding-top: 16px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted center">Loading…</p></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
